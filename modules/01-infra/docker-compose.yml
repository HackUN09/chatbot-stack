services:
  # ==========================================
  # POSTGRESQL (Hardened)
  # ==========================================
  db_core:
    image: postgres:16.6-alpine
    container_name: db_core
    restart: always
    command:
      - "postgres"
      - "-c"
      - "max_connections=500"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "work_mem=16MB"
    environment:
      POSTGRES_USER: root_admin
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
      # Inject passwords for init script
      CHATWOOT_DB_PASSWORD: ${CHATWOOT_DB_PASSWORD}
      EVOLUTION_DB_PASSWORD: ${EVOLUTION_DB_PASSWORD}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - ../../persistence/postgres:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - secure-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root_admin" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # REDIS (Hardened)
  # ==========================================
  cache_core:
    image: redis:7.4-alpine
    container_name: cache_core
    restart: always
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes" ]
    volumes:
      - ../../persistence/redis:/data
    networks:
      - secure-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      retries: 5

  # ==========================================
  # MINIO (S3 Compatible)
  # ==========================================
  core_minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: core_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - ../../persistence/minio:/data
    networks:
      - secure-net
    ports:
      # Localhost binding ONLY for security
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================
  # MINIO BUCKET CREATOR (One-off)
  # ==========================================
  create-buckets:
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    depends_on:
      core_minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c " echo 'Waiting for MinIO...' && until mc alias set minio http://core_minio:9000 '${MINIO_ROOT_USER}' '${MINIO_ROOT_PASSWORD}'; do echo '...waiting' && sleep 1; done; echo 'Creating buckets...' && mc mb --ignore-existing minio/chatwoot-storage && mc mb --ignore-existing minio/evolution-media && echo 'Setting policies...' && mc anonymous set download minio/evolution-media && mc anonymous set download minio/chatwoot-storage && echo '✅ Buckets created successfully!' "
    networks:
      - secure-net

  # ==========================================
  # MANAGEMENT TOOLS (Local Access)
  # ==========================================
  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: pgadmin
    restart: always
    env_file:
      - ../../.env
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - secure-net
    ports:
      - "127.0.0.1:5050:80"

  redis-insight:
    image: redis/redisinsight:2.62
    container_name: redis-insight
    restart: always
    volumes:
      - ../../persistence/redisinsight_data:/db
    networks:
      - secure-net
    ports:
      - "127.0.0.1:5540:5540"

networks:
  secure-net:
    external: true

volumes:
  pgadmin_data:
