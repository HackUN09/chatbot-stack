services:
  # ==========================================
  # CHATWOOT CRM
  # ==========================================
  chatwoot-web:
    image: chatwoot/chatwoot:v3.12.0
    container_name: chatwoot-web
    restart: always
    env_file: ../../.env
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      FRONTEND_URL: https://chat.${DOMAIN}
      POSTGRES_DATABASE: chatwoot
      POSTGRES_USERNAME: chatwoot_user
      POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD}
      POSTGRES_HOST: db_core
      REDIS_URL: "redis://:${REDIS_PASSWORD}@cache_core:6379/1"
      # S3 Configuration
      ACTIVE_STORAGE_SERVICE: s3_compatible
      STORAGE_BUCKET_NAME: ${CHATWOOT_BUCKET}
      STORAGE_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      STORAGE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_ENDPOINT: http://minio-core:9000
      STORAGE_CDN_HOST: https://s3.${DOMAIN}
      STORAGE_FORCE_PATH_STYLE: "true"
      STORAGE_REGION: us-east-1
      FORCE_SSL: "false"
      RAILS_SERVE_STATIC_FILES: "true"
      RAILS_LOG_TO_STDOUT: "true"
    # Auto-run DB prepare + Create admin if not exists (Idempotent)
    command: |
      /bin/sh -c '
        bundle exec rails db:prepare &&
        bundle exec rails runner "
          if User.count == 0
            account = Account.create!(name: \"Primary Account\")
            user = User.new(
              email: ENV[\"CHATWOOT_ADMIN_EMAIL\"],
              password: ENV[\"CHATWOOT_ADMIN_PASSWORD\"],
              password_confirmation: ENV[\"CHATWOOT_ADMIN_PASSWORD\"],
              name: \"Admin User\"
            )
            user.skip_confirmation!
            user.save!
            AccountUser.create!(account: account, user: user, role: :administrator)
            puts \"✅ Admin user created: #{ENV[\"CHATWOOT_ADMIN_EMAIL\"]}\"
          else
            puts \"ℹ️  Users already exist (#{User.count} users)\"
          end
        " &&
        bundle exec rails s -p 3000 -b 0.0.0.0
      '
    volumes:
      - chatwoot_data:/app/storage
    networks:
      - secure-net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
    ports:
      - "127.0.0.1:3000:3000"

  chatwoot-worker:
    image: chatwoot/chatwoot:v3.12.0
    container_name: chatwoot-worker
    restart: always
    env_file: ../../.env
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      POSTGRES_DATABASE: chatwoot
      POSTGRES_USERNAME: chatwoot_user
      POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD}
      POSTGRES_HOST: db_core
      REDIS_URL: "redis://:${REDIS_PASSWORD}@cache_core:6379/1"
      SIDEKIQ_CONCURRENCY: 25
      ACTIVE_STORAGE_SERVICE: s3_compatible
      STORAGE_BUCKET_NAME: ${CHATWOOT_BUCKET}
      STORAGE_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      STORAGE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_ENDPOINT: http://minio-core:9000
      STORAGE_CDN_HOST: https://s3.${DOMAIN}
      STORAGE_FORCE_PATH_STYLE: "true"
      STORAGE_REGION: us-east-1
      FORCE_SSL: "false"
    command: bundle exec sidekiq -C config/sidekiq.yml
    volumes:
      - chatwoot_data:/app/storage
    networks:
      - secure-net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G

  # ==========================================
  # EVOLUTION API
  # ==========================================
  app_evolution:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: app_evolution
    restart: always
    env_file: ../../.env
    environment:
      DOMAIN: ${DOMAIN}
      SERVER_URL: https://api.${DOMAIN}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_CONNECTION_POOL_MAX: 30
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution_user:${EVOLUTION_DB_PASSWORD}@db_core:5432/evolution?schema=public
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD}@cache_core:6379/2
      CACHE_REDIS_PREFIX_KEY: "evolution"
      # S3 Configuration
      S3_ENABLED: "true"
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${EVOLUTION_BUCKET}
      S3_PORT: 9000
      S3_ENDPOINT: minio-core
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      S3_USE_SSL: "false"
      # Chatwoot Integration
      CHATWOOT_ENABLED: "true"
      CHATWOOT_URL: ${CHATWOOT_URL}
      CHATWOOT_ACCOUNT_ID: ${CHATWOOT_ACCOUNT_ID}
      CHATWOOT_TOKEN: ${CHATWOOT_GLOBAL_TOKEN}
      CHATWOOT_MESSAGE_REOPEN: "true"
      CHATWOOT_MESSAGE_WA_INDICATOR: "true"
      CHATWOOT_IMPORT_CONTACTS: "true"
      CHATWOOT_IMPORT_MESSAGES: "true"
      CHATWOOT_RETRY_TIMEOUT: 5
      CORS_ORIGIN: "*"
    volumes:
      - ../../persistence/evolution/instances:/evolution/instances
      - ../../persistence/evolution/store:/evolution/store
    networks:
      - secure-net
    ports:
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # ==========================================
  # N8N
  # ==========================================
  app_n8n_editor:
    image: docker.n8n.io/n8nio/n8n:1.76.1
    container_name: app_n8n_editor
    restart: always
    env_file: ../../.env
    environment:
      N8N_HOST: n8n.${DOMAIN}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.${DOMAIN}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db_core
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n_user
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      # Execution optimization
      EXECUTIONS_DATA_MAX_AGE: 168
      EXECUTIONS_DATA_PRUNE: "true"
    volumes:
      - ../../persistence/n8n:/home/node/.n8n
    networks:
      - secure-net
    ports:
      - "127.0.0.1:5678:5678"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

networks:
  secure-net:
    external: true

volumes:
  chatwoot_data:
